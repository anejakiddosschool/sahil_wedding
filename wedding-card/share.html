<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sahil &amp; Keena — Share Card</title>
<link rel="stylesheet" href="fonts/fonts.css" />
<style>
  @page { size: 1200px 630px; margin: 0; }
  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html, body { margin: 0; background: #400c16; }

  .share {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: radial-gradient(120% 100% at 50% -10%, #7a2433 0%, #5d1524 45%, #400c16 100%);
  }
  .share::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(45deg, rgba(226,200,140,.055) 0 1.2px, transparent 1.2px 17px),
      repeating-linear-gradient(-45deg, rgba(226,200,140,.055) 0 1.2px, transparent 1.2px 17px);
  }

  .frame-outer { position: absolute; inset: 17px; border: 2px solid #e2c88c; }
  .frame-inner { position: absolute; inset: 25px; border: 1px solid rgba(226,200,140,.55); }

  .panel {
    position: absolute;
    inset: 32px;
    background-color: #fbf4e4;
    background-image: radial-gradient(rgba(110,70,35,.05) 1px, transparent 1px);
    background-size: 8px 8px;
    box-shadow: inset 0 0 0 1.5px rgba(183,138,53,.55), 0 0 26px rgba(0,0,0,.35);
  }
  .panel::after {
    content: "";
    position: absolute;
    inset: 14px;
    border: 1px solid rgba(183,138,53,.45);
  }

  .corner {
    position: absolute;
    width: 116px;
    height: 116px;
    color: #8b6724;
    z-index: 3;
  }
  .corner.tl { top: 46px; left: 46px; }
  .corner.tr { top: 46px; right: 46px; transform: scaleX(-1); }
  .corner.bl { bottom: 46px; left: 46px; transform: scaleY(-1); }
  .corner.br { bottom: 46px; right: 46px; transform: scale(-1,-1); }

  .content {
    position: absolute;
    inset: 32px;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 96px;
  }

  .medallion { width: 58px; height: 58px; color: #b78a35; display: block; }
  .invocation {
    font-family: 'Tiro Devanagari Hindi', serif;
    font-size: 19px;
    letter-spacing: .04em;
    color: #611625;
    margin-top: 6px;
  }

  .eyebrow {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: .42em;
    color: #8b6724;
    margin-top: 22px;
    padding-left: .42em;
  }

  .names {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-top: 10px;
  }
  .name {
    font-family: 'Cinzel', serif;
    font-weight: 500;
    font-size: 74px;
    line-height: 1.05;
    letter-spacing: .06em;
    color: #611625;
    margin: 0;
    padding-left: .06em;
  }
  .amp {
    display: flex;
    align-items: center;
    gap: 12px;
    color: #8b6724;
  }
  .amp .ln { display: block; width: 26px; height: 1px; background: linear-gradient(90deg, transparent, #b78a35); }
  .amp .ln:last-child { background: linear-gradient(270deg, transparent, #b78a35); }
  .amp .txt {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-size: 30px;
    letter-spacing: .06em;
  }
  .amp .dot { width: 5px; height: 5px; background: #b78a35; transform: rotate(45deg); }

  .rule {
    width: 210px;
    height: 1px;
    margin: 22px auto 0;
    background: linear-gradient(90deg, transparent, #b78a35 18%, #b78a35 82%, transparent);
  }

  .date {
    font-family: 'Cinzel', serif;
    font-size: 21px;
    letter-spacing: .2em;
    color: #611625;
    margin-top: 20px;
    padding-left: .2em;
  }
  .date .sep { color: #b78a35; }
  .venue {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-size: 19px;
    letter-spacing: .03em;
    color: #6b5142;
    margin-top: 10px;
  }
  .closing {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-size: 16px;
    color: #8b6724;
    margin-top: 18px;
    letter-spacing: .04em;
  }
</style>
</head>
<body>
<div class="share">
  <div class="frame-outer"></div>
  <div class="frame-inner"></div>
  <div class="panel"></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="orn-corner" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 100A98 98 0 0 1 100 2" stroke-width=".9"/>
      <path d="M8 100A92 92 0 0 1 100 8" stroke-width=".4" stroke-dasharray="1 3.2"/>
      <path d="M6 6 24 24" stroke-width=".8"/>
      <path d="M11 11c-3.2-.4-5.8-2.4-6.6-5.6 3.2.4 5.8 2.4 6.6 5.6Z" fill="currentColor" stroke="none" fill-opacity=".75"/>
      <path d="M15.5 15.5c.4 3.2 2.4 5.8 5.6 6.6-.4-3.2-2.4-5.8-5.6-6.6Z" fill="currentColor" stroke="none" fill-opacity=".75"/>
      <g transform="translate(34 34)" stroke-width=".55">
        <circle r="14.5" stroke-width=".5" stroke-dasharray="1 2.4"/>
        <g fill="currentColor" fill-opacity=".2">
          <path id="cp" d="M0-3.6C4-7.4 4.2-11.4 0-14C-4.2-11.4-4-7.4 0-3.6Z"/>
          <use href="#cp" transform="rotate(45)"/>
          <use href="#cp" transform="rotate(90)"/>
          <use href="#cp" transform="rotate(135)"/>
          <use href="#cp" transform="rotate(180)"/>
          <use href="#cp" transform="rotate(225)"/>
          <use href="#cp" transform="rotate(270)"/>
          <use href="#cp" transform="rotate(315)"/>
        </g>
        <circle r="3.4" fill="currentColor" stroke="none"/>
        <circle r="1.2" fill="#fbf4e4" stroke="none"/>
      </g>
      <path d="M49 34c9 1.5 16 7 19 15.5" stroke-width=".7"/>
      <path d="M34 49c1.5 9 7 16 15.5 19" stroke-width=".7"/>
      <circle cx="23" cy="9" r=".9" fill="currentColor" stroke="none"/>
      <circle cx="9" cy="23" r=".9" fill="currentColor" stroke="none"/>
    </symbol>
  </svg>

  <svg class="corner tl"><use href="#orn-corner"/></svg>
  <svg class="corner tr"><use href="#orn-corner"/></svg>
  <svg class="corner bl"><use href="#orn-corner"/></svg>
  <svg class="corner br"><use href="#orn-corner"/></svg>

  <div class="content">
    <svg class="medallion" viewBox="-50 -50 100 100" fill="none" stroke="currentColor">
      <circle r="47" stroke-width="1"/>
      <circle r="43.5" stroke-width=".4"/>
      <g stroke-width=".6">
        <path id="petal" d="M0-12C7-21 7-34 0-40C-7-34-7-21 0-12Z"/>
        <use href="#petal" transform="rotate(30)"/><use href="#petal" transform="rotate(60)"/>
        <use href="#petal" transform="rotate(90)"/><use href="#petal" transform="rotate(120)"/>
        <use href="#petal" transform="rotate(150)"/><use href="#petal" transform="rotate(180)"/>
        <use href="#petal" transform="rotate(210)"/><use href="#petal" transform="rotate(240)"/>
        <use href="#petal" transform="rotate(270)"/><use href="#petal" transform="rotate(300)"/>
        <use href="#petal" transform="rotate(330)"/>
      </g>
      <circle r="11.5" fill="#fbf4e4" stroke-width=".7"/>
      <text x="0" y="1.5" text-anchor="middle" dominant-baseline="middle"
            font-family="'Tiro Devanagari Hindi', serif" font-size="12"
            fill="#8b6724" stroke="none">ॐ</text>
    </svg>
    <div class="invocation">॥ श्री गणेशाय नमः ॥</div>

    <div class="eyebrow">TOGETHER WITH THEIR FAMILIES</div>

    <div class="names">
      <h1 class="name">SAHIL</h1>
      <div class="amp">
        <span class="ln"></span>
        <span class="dot"></span>
        <span class="txt">with</span>
        <span class="dot"></span>
        <span class="ln"></span>
      </div>
      <h1 class="name">KEENA</h1>
    </div>

    <div class="rule"></div>

    <div class="date">THURSDAY <span class="sep">·</span> 26 NOVEMBER 2026</div>
    <div class="venue">Vivah Sanskar &nbsp;·&nbsp; Community Center, Pataudi</div>
    <div class="closing">Join us as we begin our forever.</div>
  </div>
</div>
</body>
</html>
